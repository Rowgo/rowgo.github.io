<!DOCTYPE html>
<html>
    <head>
        <title>Contact</title>
        <link rel="stylesheet" href="css/style-base.css">
        <link rel="stylesheet" href="css/style.css">
        <!-- this line will make the site resize instead of scale when on mobile.-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body class="flex-column">
        <!--Header-->
        <header is="site-header"></header>
            
        <main class="wide-container flex-column center-v">
            <section>
                <h1> My Stream </h1>
                <twitch-embed channel="rowgabear" parent="roganjohnston.com"></twitch-embed>
                <p class="text-center"> If I'm streaming right now feel free to send a message in the chat. </p>
            </section>
            <hr>
            <section>
                <h1> Or Email Me </h1>
                <form class="flex-column center-v" action="https://formspree.io/f/xjkoreog" method="POST">
                    <div class="flex-column">
                        <label for="email">
                            Your email:
                        </label>
                        <input id="email" type="email" name="email" placeholder="you@email.com" required>
                    </div>
                    <div class="flex-column">
                        <label for="message">
                            Your message:
                        </label>
                        <textarea id="message" name="message" rows="5" placeholder="Hey. ;D" required></textarea>
                    </div>
                    <button class="margin" type="submit">Send</button>
                </form>
            </section>
        </main>
        <footer is="site-footer"></footer>
        
        
        <!--Java Script-->
        <script tpye="module" src="/scripts/header.js"></script>
        <script type="module" src="/scripts/footer.js"></script>
        <script type="module" src="scripts/twitch-embed.js"></script>
    </body>
</html>
